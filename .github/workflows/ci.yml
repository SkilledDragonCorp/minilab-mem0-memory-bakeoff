name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  MEM0_TELEMETRY: "False"
  HF_HOME: ${{ github.workspace }}/.cache/huggingface

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.10.3"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.2.2"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Cache Hugging Face / fastembed models
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: fastembed-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install Python deps
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Ruff format
        run: uv run ruff format --check src tests

      - name: Mypy
        run: uv run mypy src/memory_bakeoff

      - name: Unit tests (no network)
        run: uv run pytest tests -m "not e2e and not live_llm" -q

      - name: Keyless E2E tests
        run: uv run pytest tests -m e2e -q

      - name: MCP smoke
        run: uv run pytest tests/test_mcp_smoke.py -q

      - name: Skills layout
        run: bash scripts/check-skills-layout.sh

      - name: Bun install + typecheck
        working-directory: mcp
        run: |
          bun install
          bun run typecheck

      - name: JS dependency audit
        run: |
          curl -sSfL https://github.com/google/osv-scanner/releases/download/v1.9.2/osv-scanner_1.9.2_linux_amd64 -o /tmp/osv-scanner
          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner scan --lockfile=mcp/bun.lock
          cd mcp && (bun audit --audit-level high || true)

      - name: pip-audit
        run: |
          uv export --format requirements.txt --no-dev -o /tmp/requirements.txt
          uv run pip-audit -r /tmp/requirements.txt

      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Gitleaks
        run: gitleaks git --redact --exit-code 1
